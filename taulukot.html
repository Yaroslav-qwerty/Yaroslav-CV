    <main>  
        <h3>Taulukot</h3>   

        <h2>Poimi elementti</h2>
        <input type="number" id="poimiNumero" placeholder="Anna indeksi">
        <button onclick="naytaSana()">Näytä</button>
        <div id="poimiTulos"></div>

        <h2>Löydä indeksi</h2>
        <input type="text" id="haeSana" placeholder="Anna sana">
        <button onclick="naytaIndeksi()">Näytä</button>
        <div id="indeksiTulos"></div>

        <h2>Leikkaa taulukko</h2>
        <input type="number" id="leikkaaAlku" placeholder="Alkuindeksi">
        <input type="number" id="leikkaaLoppu" placeholder="Loppuindeksi">
        <button onclick="leikkaaTaulukko()">Näytä</button>
        <ul id="leikkaaTulos"></ul>

        <h2>Järjestä</h2>
        <button onclick="tulostaSanat()">Tulosta tekstit</button>
        <button onclick="jarjestaSanat()">Järjestä tekstit</button>
        <button onclick="kaannaSanat()">Käännä tekstien järjestys</button>
        <br>
        <button onclick="tulostaNumerot()">Tulosta numerot</button>
        <button onclick="jarjestaNumerot()">Järjestä numerot</button>
        <button onclick="kaannaNumerot()">Käännä numeroiden järjestys</button>
        <ul id="jarjestaTulos"></ul>

        <h2>Suodata</h2>
        <input type="number" id="suodatinNumero" placeholder="Anna luku">
        <button onclick="tulostaNumerotSuodatus()">Tulosta numerot</button>
        <button onclick="valitsePienemmat()">Valitse pienemmät</button>
        <button onclick="valitseSuuremmat()">Valitse suuremmat</button>
        <ul id="suodataTulos"></ul>
